version: '3.8'

services:
  athena:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: athena-app
    ports:
      - "8080:8080"
    volumes:
      # Mount the data directory to persist SQLite database on host
      - ./data:/data
    environment:
      - DB_PATH=/data/athena.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
