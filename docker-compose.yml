version: '3.8'

services:
  # Athena Application (SQLite)
  athena:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: athena-app
    ports:
      - "9206:9206"
    volumes:
      - athena-data:/data
    environment:
      - PORT=9206
      - DB_TYPE=sqlite
      - DB_PATH=/data/athena.db
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - CORS_ENABLED=true
      - CORS_ALLOWED_ORIGINS=*
    networks:
      - athena-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9206/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Development mode (hot reload)
  athena-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: athena-dev
    ports:
      - "9206:9206"
    volumes:
      - .:/app
      - go-modules:/go/pkg/mod
    environment:
      - PORT=9206
      - DB_TYPE=sqlite
      - DB_PATH=/data/athena.db
      - LOG_LEVEL=debug
      - LOG_FORMAT=text
    networks:
      - athena-network
    restart: unless-stopped
    profiles:
      - dev

networks:
  athena-network:
    driver: bridge

volumes:
  go-modules:
    driver: local
  athena-data:
    driver: local
