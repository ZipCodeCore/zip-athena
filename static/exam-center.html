<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a3a5c">
    <link rel="manifest" href="/manifest.json">
    <title>Exam Center - Athena</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/classic.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
        <div class="container-fluid">
            <div class="d-flex align-items-center">
                <a class="navbar-brand mb-0" href="/dashboard.html">
                    <img src="/images/logo.png" alt="Athena Logo" style="height: 24px; margin-right: 8px;"><strong>Athena</strong> <span class="badge bg-warning text-dark">(Beta-1)</span>
                </a>
                <div class="form-check form-switch navbar-theme-switch ms-2">
                    <input class="form-check-input theme-toggle" type="checkbox" id="themeToggle" aria-label="Toggle dark mode">
                    <label class="form-check-label text-white small" for="themeToggle">Dark</label>
                </div>
            </div>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto">
                    <span class="navbar-text text-white me-3" id="userDisplay"></span>
                    <a href="/dashboard.html" class="btn btn-sm btn-outline-light me-2">← Dashboard</a>
                    <button class="btn btn-sm btn-outline-light" onclick="logout()">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row mb-4">
            <div class="col-md-12">
                <h2><i class="bi bi-journals"></i> Exam Center</h2>
                <p class="text-muted">View your assigned exams and review submitted exams.</p>
            </div>
        </div>

        <!-- Pending Exams -->
        <div class="row mb-4">
            <div class="col-md-12">
                <div class="card border-danger">
                    <div class="card-header bg-danger text-white">
                        <h5 class="mb-0"><i class="bi bi-pencil-fill"></i> Pending Exams</h5>
                    </div>
                    <div class="card-body">
                        <div id="pendingExamsList">
                            <div class="text-center text-muted">
                                <div class="spinner-border spinner-border-sm" role="status"></div>
                                Loading...
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Submitted Exams -->
        <div class="row mb-4">
            <div class="col-md-12">
                <div class="card border-success">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0"><i class="bi bi-check-circle-fill"></i> Submitted Exams</h5>
                    </div>
                    <div class="card-body">
                        <div id="submittedExamsList">
                            <div class="text-center text-muted">
                                <div class="spinner-border spinner-border-sm" role="status"></div>
                                Loading...
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/exam-center.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/sw.js");
        }
    </script>
</body>
</html>
