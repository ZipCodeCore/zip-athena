<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a3a5c">
    <link rel="manifest" href="/manifest.json">
    <title>Admin – Quizzes - Athena</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/classic.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Top-level navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <img src="/images/logo.png" alt="Athena Logo" style="height: 24px; margin-right: 8px;">Athena
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto">
                    <span class="navbar-text text-white me-3">Admin: <span id="username"></span></span>
                    <a href="/dashboard.html" class="btn btn-outline-warning btn-sm me-2">Dashboard</a>
                    <a href="/instructor.html" class="btn btn-outline-info btn-sm me-2">Administration</a>
                    <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Local admin navigation -->
    <div class="bg-light border-bottom py-2">
        <div class="container-fluid">
            <ul class="nav nav-pills nav-sm mb-0">
                <li class="nav-item"><a class="nav-link" href="/admin.html">Users</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin-questions.html">Questions</a></li>
                <li class="nav-item"><a class="nav-link active" href="/admin-quizzes.html">Quizzes</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin-topics.html">Topics</a></li>
            </ul>
        </div>
    </div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Quiz Management</h2>
            <button class="btn btn-primary" onclick="showCreateQuizModal()">Create Quiz</button>
        </div>
        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Topic ID</th>
                        <th>Description</th>
                        <th>Created</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="quizzesTable"></tbody>
            </table>
        </div>
    </div>

    <!-- Create/Edit Quiz Modal -->
    <div class="modal fade" id="quizModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="quizModalTitle">Create Quiz</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="quizForm">
                        <input type="hidden" id="quizId">
                        <div class="mb-3">
                            <label for="quizName" class="form-label">Quiz Name (e.g., java.1)</label>
                            <input type="text" class="form-control" id="quizName" required>
                        </div>
                        <div class="mb-3">
                            <label for="quizTopicId" class="form-label">Topic ID</label>
                            <input type="number" class="form-control" id="quizTopicId" required>
                        </div>
                        <div class="mb-3">
                            <label for="quizDescription" class="form-label">Description</label>
                            <textarea class="form-control" id="quizDescription" rows="3"></textarea>
                        </div>
                    </form>

                    <!-- Questions Section (only shown when editing existing quiz) -->
                    <div id="quizQuestionsSection" style="display: none;">
                        <hr>
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h6>Quiz Questions</h6>
                            <button type="button" class="btn btn-sm btn-success" onclick="showAddQuestionToQuizForm()">Add Question</button>
                        </div>

                        <!-- Add Question to Quiz Form -->
                        <div id="addQuestionToQuizForm" style="display: none;" class="mb-3 p-3 border rounded bg-light">
                            <div class="mb-2">
                                <label for="quizQuestionId" class="form-label">Question ID</label>
                                <input type="number" class="form-control" id="quizQuestionId" min="1" required>
                            </div>
                            <div class="mb-2">
                                <label for="quizQuestionOrder" class="form-label">Order</label>
                                <input type="number" class="form-control" id="quizQuestionOrder" min="0" value="0" required>
                            </div>
                            <button type="button" class="btn btn-sm btn-primary" onclick="addQuestionToQuiz()">Add Question</button>
                            <button type="button" class="btn btn-sm btn-secondary" onclick="cancelAddQuestionToQuiz()">Cancel</button>
                        </div>

                        <!-- Quiz Questions List -->
                        <div id="quizQuestionsList"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="saveQuiz()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/admin/quizzes-page.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/sw.js");
        }
    </script>
</body>
</html>
