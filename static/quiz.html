<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d6efd">
    <link rel="manifest" href="/manifest.json">
    <title>Quiz - Athena</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/dashboard.html">
                <strong>Athena</strong> <span class="badge bg-danger">(Beta-1)</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto">
                    <span class="navbar-text text-white me-3">
                        <span id="userDisplay"></span>
                    </span>
                    <a href="/instructor.html" class="btn btn-sm btn-outline-warning" id="instructorButton" style="display: none;">Administration</a>
                    <button class="btn btn-sm btn-outline-light" onclick="logout()">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Difficulty Selection Modal -->
    <div id="difficultyModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1050; align-items: center; justify-content: center;">
        <div class="card" style="max-width: 500px; margin: auto; margin-top: 100px;">
            <div class="card-header">
                <h5 class="mb-0">Select Quiz Difficulty</h5>
            </div>
            <div class="card-body">
                <p class="mb-3">Please select the difficulty level for your quiz:</p>
                <div class="list-group">
                    <label class="list-group-item list-group-item-action" style="cursor: pointer;">
                        <input class="form-check-input me-2" type="radio" name="difficulty" value="1" id="difficulty1">
                        <strong>Level 1 - Easiest</strong>
                        <br><small class="text-muted">Only the easiest questions</small>
                    </label>
                    <label class="list-group-item list-group-item-action" style="cursor: pointer;">
                        <input class="form-check-input me-2" type="radio" name="difficulty" value="2" id="difficulty2">
                        <strong>Level 2 - Medium</strong>
                        <br><small class="text-muted">Easy and medium difficulty questions</small>
                    </label>
                    <label class="list-group-item list-group-item-action" style="cursor: pointer;">
                        <input class="form-check-input me-2" type="radio" name="difficulty" value="3" id="difficulty3" checked>
                        <strong>Level 3 - Hard</strong>
                        <br><small class="text-muted">All difficulty levels (default)</small>
                    </label>
                </div>
            </div>
            <div class="card-footer">
                <a href="/dashboard.html" class="btn btn-secondary" role="button">Cancel</a>
                <button type="button" class="btn btn-primary" id="startQuizBtn">Start Quiz</button>
            </div>
        </div>
    </div>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 id="topicTitle">Quiz</h2>
                    <a href="/dashboard.html" class="btn btn-secondary">Back to Dashboard</a>
                </div>
            </div>
        </div>

        <!-- Quiz Progress -->
        <div class="row mb-4">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h5 class="mb-0">Progress</h5>
                            <span class="badge bg-primary" id="progressBadge">Question 0 of 0</span>
                        </div>
                        <div class="progress">
                            <div id="progressBar" class="progress-bar" role="progressbar" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quiz Question -->
        <div id="quizContent">
            <div class="row">
                <div class="col-md-12">
                    <div class="card">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <h4 id="questionText">Loading question...</h4>
                                <span class="badge bg-info" id="difficultyBadge"></span>
                            </div>
                            
                            <div id="answersContainer">
                                <!-- Answer options will be loaded here -->
                            </div>

                            <div id="feedbackContainer" class="mt-4" style="display: none;">
                                <div class="alert" id="feedbackAlert" role="alert"></div>
                                <button class="btn btn-warning" id="nextButton">Next Question</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quiz Complete -->
        <div id="quizComplete" style="display: none;">
            <div class="row">
                <div class="col-md-8 mx-auto">
                    <div class="card text-center">
                        <div class="card-body">
                            <h2 class="mb-4">Quiz Complete!</h2>
                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <h4>Score</h4>
                                    <h1 id="finalScore">0%</h1>
                                </div>
                                <div class="col-md-6">
                                    <h4>Results</h4>
                                    <h3 id="finalResults">0 / 0</h3>
                                </div>
                            </div>
                            <div class="d-grid gap-2">
                                <a href="/dashboard.html" class="btn btn-primary btn-lg">Back to Dashboard</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/quiz.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/sw.js");
        }
    </script>
</body>
</html>
