<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Athena</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/dashboard.html">
                <strong>Athena</strong><small><span class="badge bg-danger">(Alpha1)</span></small> Quiz Platform
            </a>
            <div class="navbar-text text-white">
                <span id="userDisplay"></span>
                <a href="/admin.html" class="btn btn-sm btn-outline-warning ms-3" id="adminButton" style="display: none;">Administration</a>
                <button class="btn btn-sm btn-outline-light ms-3" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 id="topicTitle">Quiz</h2>
                    <a href="/dashboard.html" class="btn btn-secondary">Back to Dashboard</a>
                </div>
            </div>
        </div>

        <!-- Quiz Progress -->
        <div class="row mb-4">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h5 class="mb-0">Progress</h5>
                            <span class="badge bg-primary" id="progressBadge">Question 0 of 0</span>
                        </div>
                        <div class="progress">
                            <div id="progressBar" class="progress-bar" role="progressbar" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quiz Question -->
        <div id="quizContent">
            <div class="row">
                <div class="col-md-12">
                    <div class="card">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <h4 id="questionText">Loading question...</h4>
                                <span class="badge bg-info" id="difficultyBadge"></span>
                            </div>
                            
                            <div id="answersContainer">
                                <!-- Answer options will be loaded here -->
                            </div>

                            <div id="feedbackContainer" class="mt-4" style="display: none;">
                                <div class="alert" id="feedbackAlert" role="alert"></div>
                                <button class="btn btn-primary" id="nextButton">Next Question</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quiz Complete -->
        <div id="quizComplete" style="display: none;">
            <div class="row">
                <div class="col-md-8 mx-auto">
                    <div class="card text-center">
                        <div class="card-body">
                            <h2 class="mb-4">Quiz Complete!</h2>
                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <h4>Score</h4>
                                    <h1 id="finalScore">0%</h1>
                                </div>
                                <div class="col-md-6">
                                    <h4>Results</h4>
                                    <h3 id="finalResults">0 / 0</h3>
                                </div>
                            </div>
                            <div class="d-grid gap-2">
                                <a href="/dashboard.html" class="btn btn-primary btn-lg">Back to Dashboard</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/quiz.js"></script>
</body>
</html>
