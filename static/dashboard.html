<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d6efd">
    <link rel="manifest" href="/manifest.json">
    <title>Dashboard - Athena</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/dashboard.html">
                <strong>Athena</strong><span class="badge bg-danger">(Alpha-4)</span> Quiz Platform
            </a>
            <div class="navbar-text text-white">
                <span id="userDisplay"></span>
                <a href="/instructor.html" class="btn btn-sm btn-outline-warning ms-3" id="instructorButton" style="display: none;">Administration</a>
                <button class="btn btn-sm btn-outline-light ms-3" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-12">
                <h2 class="mb-4">Student Dashboard</h2>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="row mb-4">
            <div class="col-md-12">
                <a href="/learning.html" class="btn btn-primary btn-lg">
                    📚 Learning Center
                </a>
            </div>
        </div>

        <!-- Progress Summary -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card bg-primary text-white">
                    <div class="card-body">
                        <h5 class="card-title">Total Points</h5>
                        <h2 id="totalPoints" class="mb-0">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-success text-white">
                    <div class="card-body">
                        <h5 class="card-title">Quizzes Taken</h5>
                        <h2 id="totalQuizzes" class="mb-0">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-info text-white">
                    <div class="card-body">
                        <h5 class="card-title">Questions Answered</h5>
                        <h2 id="totalQuestions" class="mb-0">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-warning text-white">
                    <div class="card-body">
                        <h5 class="card-title">Correct Answers</h5>
                        <h2 id="totalCorrect" class="mb-0">0</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Topics Section -->
        <div class="row mb-4">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <h4>Available Topics</h4>
                    </div>
                    <div class="card-body">
                        <div id="topicsList" class="row g-3">
                            <!-- Topics will be loaded here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Recent Quiz Attempts -->
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <h4>Recent Quiz Attempts</h4>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>Quiz ID</th>
                                        <th>Quiz Description</th>
                                        <th>Started</th>
                                        <th>Status</th>
                                        <th>Correct</th>
                                        <th>Difficulty</th>
                                        <th>Score</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody id="quizAttemptsTable">
                                    <!-- Quiz attempts will be loaded here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/dashboard.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/sw.js");
        }
    </script>
</body>
</html>
