<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Center - Athena</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .learning-container {
            height: calc(100vh - 120px);
            overflow: hidden;
        }
        .outline-pane {
            height: 100%;
            overflow-y: auto;
            border-right: 1px solid #dee2e6;
            padding: 20px;
            background-color: #f8f9fa;
        }
        .content-pane {
            height: 100%;
            overflow-y: auto;
            padding: 30px;
        }
        .phase-section {
            margin-bottom: 20px;
        }
        .phase-header {
            cursor: pointer;
            padding: 12px;
            background-color: #0d6efd;
            color: white;
            border-radius: 6px;
            margin-bottom: 8px;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        .phase-header:hover {
            background-color: #0b5ed7;
        }
        .phase-header.collapsed {
            background-color: #6c757d;
        }
        .phase-header.collapsed:hover {
            background-color: #5c636a;
        }
        .resource-list {
            list-style: none;
            padding-left: 0;
            margin-left: 15px;
        }
        .resource-item {
            padding: 8px 12px;
            margin: 4px 0;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .resource-item:hover {
            background-color: #e9ecef;
        }
        .resource-item.active {
            background-color: #d1e7fd;
            font-weight: 600;
        }
        .resource-item.viewed {
            color: #198754;
        }
        .language-badge {
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 3px;
        }
        .java-badge {
            background-color: #f89820;
            color: white;
        }
        .python-badge {
            background-color: #3776ab;
            color: white;
        }
        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            color: #6c757d;
        }
        .welcome-screen i {
            font-size: 80px;
            margin-bottom: 20px;
        }
        .markdown-content {
            max-width: 900px;
        }
        .markdown-content pre {
            background-color: #f6f8fa;
            padding: 16px;
            border-radius: 6px;
            overflow-x: auto;
        }
        .markdown-content code {
            background-color: #f6f8fa;
            padding: 2px 6px;
            border-radius: 3px;
        }
        .markdown-content pre code {
            padding: 0;
            background-color: transparent;
        }
        .markdown-content h1 {
            border-bottom: 2px solid #dee2e6;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .markdown-content h2 {
            margin-top: 30px;
            margin-bottom: 15px;
            color: #495057;
        }
        .markdown-content h3 {
            margin-top: 20px;
            margin-bottom: 10px;
            color: #6c757d;
        }
        .action-buttons {
            position: sticky;
            top: 0;
            background-color: white;
            padding: 15px 0;
            border-bottom: 1px solid #dee2e6;
            margin-bottom: 20px;
            z-index: 100;
        }
        .progress-indicator {
            font-size: 0.85rem;
            color: #6c757d;
        }
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
        }
        .search-box {
            margin-bottom: 20px;
        }
        .phase-description {
            font-size: 0.85rem;
            color: #6c757d;
            margin-left: 15px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/dashboard.html">
                <strong>Athena</strong> <span class="badge bg-danger">(Alpha3)</span> Learning Center
            </a>
            <div class="navbar-text text-white d-flex align-items-center gap-3">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="languageToggle" checked>
                    <label class="form-check-label" for="languageToggle" id="languageLabel">Both Languages</label>
                </div>
                <span id="userDisplay"></span>
                <a href="/dashboard.html" class="btn btn-sm btn-outline-light">Dashboard</a>
                <button class="btn btn-sm btn-outline-light" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container-fluid learning-container">
        <div class="row h-100">
            <!-- Left Pane: Outline -->
            <div class="col-md-3 outline-pane">
                <div class="search-box">
                    <input type="text" class="form-control" id="searchInput" placeholder="Search topics...">
                </div>
                <div id="outlineContainer">
                    <div class="loading-spinner">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Pane: Content -->
            <div class="col-md-9 content-pane">
                <div id="contentContainer">
                    <div class="welcome-screen">
                        <div style="font-size: 80px; margin-bottom: 20px;">📚</div>
                        <h2>Welcome to the Learning Center</h2>
                        <p class="lead">Select a topic from the outline to begin studying.</p>
                        <p class="text-muted">Your progress is automatically tracked as you explore the materials.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="/js/learning.js"></script>
</body>
</html>
